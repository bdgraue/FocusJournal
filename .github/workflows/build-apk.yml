name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install required Android NDK
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"

      - name: Generate debug keystore
        run: keytool -genkey -v -keystore android/app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Override local Java home for CI
        run: sed -i "s|org.gradle.java.home=.*|org.gradle.java.home=$JAVA_HOME|" android/gradle.properties

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK to include version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          APK_DIR=build/app/outputs/flutter-apk
          for f in "$APK_DIR"/*.apk; do
            mv "$f" "$APK_DIR/FocusJournal-v${VERSION}.apk"
            break
          done

      - uses: actions/upload-artifact@v4
        with:
          name: FocusJournal-APK
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 90
