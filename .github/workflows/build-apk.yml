name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install required Android NDK
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"

      - name: Restore signing keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              '${{ secrets.STORE_PASSWORD }}' '${{ secrets.KEY_ALIAS }}' '${{ secrets.KEY_PASSWORD }}' \
              > android/key.properties
          else
            keytool -genkey -v -keystore android/app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning::No KEYSTORE_BASE64 secret set — generated a temporary debug keystore. APK signature will differ between builds."
          fi

      - name: Override local Java home for CI
        run: sed -i "s|org.gradle.java.home=.*|org.gradle.java.home=$JAVA_HOME|" android/gradle.properties

      - run: flutter pub get

      - name: Show Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        # versionCode comes from pubspec.yaml (version: X.Y.Z+N) so that a
        # local release build and a CI build of the same commit agree.
        run: flutter build apk --release --verbose

      - name: Read version from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK to include version
        run: |
          APK_DIR=build/app/outputs/flutter-apk
          mv "$APK_DIR/app-release.apk" "$APK_DIR/FocusJournal-v${{ steps.version.outputs.version }}-build${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FocusJournal-v${{ steps.version.outputs.version }}-build${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 90
